<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prancha · fotos na medida exata, prontas para recortar</title>
  <meta name="description" content="Monte suas fotos no tamanho certo numa folha A4 (ou qualquer papel), com marcas de corte, e imprima na medida exata.">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <style id="estilo-pagina"></style>
</head>
<body data-etapa="prancha">
<div class="app">
  <header class="topo">
    <div class="marca"><img src="icone.svg" alt="" width="26" height="26"><h1>Prancha</h1></div>
    <span class="resumo" id="resumo"></span>
  </header>

  <!-- celular: fotos → tamanho → prancha -->
  <main class="assistente" id="wizard">
    <div class="wz-cartao">
      <ol class="wz-trilha"><li></li><li></li><li></li></ol>

      <section id="wzFotos">
        <h2>Fotos</h2>
        <button class="soltar" id="wzEscolher"><span class="soltar-ico">＋</span><b>Escolher fotos</b></button>
      </section>

      <section id="wzTamanho" hidden>
        <h2>Tamanho</h2>
        <div class="wz-thumbs" id="wzThumbs"></div>

        <label class="wz-rotulo">Medida (cm)</label>
        <div class="wz-medida">
          <input type="text" inputmode="decimal" id="wzW" aria-label="largura em cm">
          <span>×</span>
          <input type="text" inputmode="decimal" id="wzH" aria-label="altura em cm">
          <button class="btn icone" id="wzInverter" title="trocar largura e altura">⇄</button>
        </div>

        <div class="wz-botoes">
          <button class="btn icone grande" id="wzVoltar" aria-label="voltar">←</button>
          <button class="btn primario grande" id="wzMontar">Montar</button>
        </div>
      </section>

      <button class="link wz-cancelar" id="wzCancelar" hidden>cancelar</button>
    </div>
  </main>

  <main class="corpo">
    <aside class="painel">
      <section class="passo">
        <h2>Fotos</h2>
        <div id="grupos"></div>
        <button class="btn largo" id="outroTamanho">+ Outro tamanho</button>
      </section>

      <details class="passo ajustes">
        <summary>Mais ajustes</summary>
        <div class="rotulo"><span>Papel</span></div>
        <div class="papeis" data-papeis></div>
        <div class="linha custom" id="papelCustom" hidden>
          <input type="text" inputmode="decimal" id="papelW" aria-label="largura do papel em cm"> <span>×</span>
          <input type="text" inputmode="decimal" id="papelH" aria-label="altura do papel em cm"> <span class="un">cm</span>
        </div>
        <div class="rotulo sep"><span>Espaço entre fotos</span><button class="link" id="espacoSug" title="voltar para 4 mm">4 mm</button></div>
        <div class="faixa"><input type="range" id="espaco" min="0" max="15" step="0.5" aria-label="espaço entre as fotos"><span class="val" id="espacoVal"></span></div>
        <div class="rotulo"><span>Margem</span><button class="link" id="margemSug" title="voltar para 5 mm">5 mm</button></div>
        <div class="faixa"><input type="range" id="margem" min="0" max="25" step="0.5" aria-label="margem do papel"><span class="val" id="margemVal"></span></div>
        <div class="rotulo"><span>Guias de corte</span></div>
        <div class="seg" id="guias">
          <button data-v="cantos">Cantos</button>
          <button data-v="contorno">Contorno</button>
          <button data-v="nada">Nada</button>
        </div>
        <label class="check" title="A foto passa 1 mm da linha: se o corte desviar, não sobra filete branco."><input type="checkbox" id="sangria"><span>Sangria de 1 mm</span></label>
        <label class="check" title="Foto deitada num tamanho em pé ganha o quadro deitado."><input type="checkbox" id="girarFoto"><span>Quadro segue a foto</span></label>
        <label class="check" title="Gira os quadros só quando isso gasta menos folhas."><input type="checkbox" id="girar"><span>Girar para economizar papel</span></label>
        <label class="check"><input type="checkbox" id="centralizar"><span>Centralizar</span></label>
        <button class="btn pequeno fantasma" id="limpar">Começar do zero</button>
      </details>
    </aside>

    <section class="previa" id="previa">
      <div class="barra-previa">
        <button class="btn pequeno" id="virar" title="virar o papel"><i class="ico-folha pe" id="virarIco"></i>Virar</button>
        <button class="btn pequeno" id="addFotos">+ Fotos</button>
      </div>
      <div class="avisos" id="avisos"></div>
      <div class="folhas" id="folhas"></div>
      <button class="vazio" id="vazio" hidden><span class="soltar-ico">＋</span><b>Escolher fotos</b><small>ou arraste para cá</small></button>
    </section>
  </main>

  <footer class="acoes">
    <button class="btn primario" id="btnImprimir" title="Na impressora, escolha tamanho real (100%)">Imprimir</button>
    <button class="btn" id="btnPdf">PDF</button>
    <button class="btn" id="btnPng">Imagem</button>
  </footer>
</div>

<div class="modal" id="editor" hidden>
  <div class="editor">
    <div class="ed-topo"><b id="edTam"></b><button class="btn icone" id="edFechar" aria-label="fechar">✕</button></div>
    <canvas id="edCanvas"></canvas>
    <div class="ed-faixas">
      <label class="ed-faixa"><span>Zoom</span><input type="range" id="edZoom" min="0" max="1" step="0.001"></label>
      <label class="ed-faixa"><span>Girar</span><input type="range" id="edAngulo" min="-45" max="45" step="0.1"><button class="val" id="edAnguloVal" title="voltar para 0°">0°</button></label>
    </div>
    <div class="ed-botoes">
      <button class="btn pequeno" id="edGirar" title="girar 90°">↻ 90°</button>
      <button class="btn pequeno" id="edVirar">Deitar quadro</button>
      <button class="btn pequeno" id="edPreencher">Preencher</button>
      <button class="btn pequeno" id="edInteira">Inteira</button>
      <button class="btn pequeno" id="edTrocar">Trocar</button>
      <button class="btn pequeno perigo" id="edTirar">Remover</button>
      <button class="btn primario" id="edPronto">Pronto</button>
    </div>
  </div>
</div>

<div class="ocupado" id="ocupado" hidden><div class="caixinha"><i class="giro"></i><span id="ocupadoTxt"></span></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="impressao"></div>
<input type="file" id="arquivo" accept="image/*" multiple hidden>
<script src="app.js"></script>
</body>
</html>
